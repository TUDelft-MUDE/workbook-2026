<div class="dropdown changelog-notifications">
  <button type="button" class="btn btn-sm" disabled
          title="Enable JavaScript to use changelog notifications"
          aria-label="Enable JavaScript to use changelog notifications"
          aria-pressed="false" data-bs-placement="bottom" data-bs-toggle="tooltip">
    <i class="fa-solid fa-bell-slash" aria-hidden="true"></i>
  </button>
  <div>
    <div class="dropdown-menu changelog-notifications-status">
      <span class="dropdown-item-text" role="status"></span>
      <button type="button" class="btn btn-sm changelog-notifications-status-close"
              data-changelog-status-close aria-label="Close notification message" hidden>&times;</button>
    </div>
  </div>
  <div>
    <div class="dropdown-menu changelog-notifications-intro" hidden
         role="region" aria-label="Changelog notifications">
      <p class="dropdown-item-text">Get notified about changelog updates when you open the workbook?</p>
      <div class="changelog-notifications-actions">
        <button type="button" data-changelog-enable>Enable notifications</button>
        <button type="button" data-changelog-dismiss>Not now</button>
      </div>
    </div>
  </div>
</div>
